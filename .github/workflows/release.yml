name: Release

# Pushing a tag v<version> builds the archives of that version and publishes them
# as a GitHub Release. The work is in scripts/release.sh, which can be run on a
# development machine to see what a release would contain; this file only gives it
# a runner, a token and the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Creating the release is the one write; the build steps run with the token
    # of the job, but only the last step uses it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The notes come first so that a tag without a changelog section fails
      # before anything is built. Both outputs go outside the checkout: a file
      # in it would make the build report an uncommitted change.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - name: Build the archives
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.sh "${TAG#v}" "$RUNNER_TEMP/dist"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          flags=()
          # A version with a pre-release part (0.9.0-rc.1) is not the latest release.
          case $version in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* \
            --verify-tag \
            --title "Sidera $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
