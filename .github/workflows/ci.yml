name: CI
run-name: Diagnostic only - Ubuntu run cost

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Disposable measurement only: one job, no full-walk fallback or retry.
jobs:
  ubuntu-cost:
    name: Diagnostic only - Ubuntu run cost
    if: ${{ github.ref == 'refs/heads/codex/f7b-ubuntu-cost' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SIDERA_CRASHWALK: full
      SIDERA_CRASHWALK_SHARD: 1/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: create owned evidence directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.scratch"
          export_dir=$(mktemp -d "$GITHUB_WORKSPACE/.scratch/uc-export.XXXXXX")
          echo "SIDERA_UBUNTU_COST_EXPORT=$export_dir" >> "$GITHUB_ENV"
          touch "$export_dir/timings.jsonl"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: initialize allowlisted manifest
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          def checked(value, pattern):
              if not re.fullmatch(pattern, value):
                  raise SystemExit("invalid diagnostic manifest metadata")
              return value
          version = subprocess.check_output(["go", "version"], text=True).split()[2]
          data = {
              "candidate_sha": "b486d9f40fe067c389fed2f6bc0f675cf306901d",
              "diagnostic_sha": checked(os.environ["GITHUB_SHA"], r"[0-9a-f]{40}"),
              "runner_os": checked(os.environ["RUNNER_OS"], r"Linux"),
              "runner_arch": checked(os.environ["RUNNER_ARCH"], r"X64|ARM64"),
              "runner_image": checked(os.environ["ImageOS"], r"ubuntu[0-9]+"),
              "runner_image_version": checked(os.environ["ImageVersion"], r"[0-9.]+"),
              "go_version": checked(version, r"go[0-9]+\.[0-9]+\.[0-9]+"),
              "command": "SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=1/3 go test -race=true -count=3 -failfast -json -timeout 6m -tags acceptance,diagnostic -run '^TestUbuntuRunCostSample$' ./cmd/sidera/internal/acceptance",
              "race": True,
              "seed": "TestCrashAtEveryCrashPointPreservesInvariants",
              "targets": [
                  {"scenario": "maintenance-retention", "generation": 1, "target": "ack/body.remove#2"},
                  {"scenario": "recovery-body-feedback", "generation": 1, "target": "clock-high-water/clock.rename#2"},
              ],
              "started_at": None, "ended_at": None, "exit_code": None,
          }
          path = pathlib.Path(os.environ["SIDERA_UBUNTU_COST_EXPORT"]) / "manifest.json"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: required diagnostic entry point must exist
        run: |
          names=$(go test -race=true -tags acceptance,diagnostic -list '^TestUbuntuRunCostSample$' ./cmd/sidera/internal/acceptance)
          printf '%s\n' "$names" | grep -Fx 'TestUbuntuRunCostSample'
      - name: measure two exact targets three times
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib
          path = pathlib.Path(os.environ["SIDERA_UBUNTU_COST_EXPORT"]) / "manifest.json"
          data = json.loads(path.read_text())
          data["started_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          set +e
          go test -race=true -count=3 -failfast -json -timeout 6m -tags acceptance,diagnostic -run '^TestUbuntuRunCostSample$' ./cmd/sidera/internal/acceptance
          test_exit=$?
          set -e
          python3 - "$test_exit" <<'PY'
          import datetime, json, os, pathlib, sys
          path = pathlib.Path(os.environ["SIDERA_UBUNTU_COST_EXPORT"]) / "manifest.json"
          data = json.loads(path.read_text())
          data["ended_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data["exit_code"] = int(sys.argv[1])
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          exit "$test_exit"
      - name: upload only typed measurement evidence
        if: ${{ always() && env.SIDERA_UBUNTU_COST_EXPORT != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-cost-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ env.SIDERA_UBUNTU_COST_EXPORT }}/manifest.json
            ${{ env.SIDERA_UBUNTU_COST_EXPORT }}/timings.jsonl
