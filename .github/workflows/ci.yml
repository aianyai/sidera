name: CI
run-name: Diagnostic only - native acceptance feedback

on:
  workflow_dispatch:

permissions:
  contents: read

# Each dispatch is independent. This branch has no automatic trigger or retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SIDERA_CI_DIAGNOSTIC_EXPORT: ${{ github.workspace }}/.scratch/ci-diagnostic-export

# Four independent jobs cap this experiment at 240 runner-minutes in total.
jobs:
  windows-acceptance:
    name: Diagnostic only - windows-acceptance
    if: ${{ github.ref == 'refs/heads/codex/f7b-ci-feedback' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: verify export privacy boundaries
        run: go test -count=1 -tags diagnostic -run '^TestDiagnostic' ./cmd/sidera/internal/acceptance
      - name: original Windows acceptance
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            go test -race=false -count=1 -timeout 25m -tags acceptance,crashtest,testclock -skip '^TestCrashAtEveryCrashPoint' ./cmd/sidera ./cmd/sidera/internal/acceptance/...
        run: |
          set +e
          go test -race=false -count=1 -timeout 25m -tags acceptance,crashtest,testclock -skip '^TestCrashAtEveryCrashPoint' ./cmd/sidera ./cmd/sidera/internal/acceptance/...
          status=$?
          printf '{"command":"original Windows acceptance","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: original failure test names must exist
        run: |
          names=$(go test -tags acceptance,crashtest,testclock -list '^(TestRuntimeProfileProbesAcrossGeneration|TestSuccessfulCommandWithoutTokenPresentationDoesNotPassProbe|TestUnobservedPreparationLeavesGenerationOneForDaemon|TestRealBinaryTargetNeedsMarkerAndAbnormalExit|TestBinarySessionBindingRunsSharedRecipeAcrossGeneration|TestBinaryDomainCallbacksPreserveClockFailureAndRejectFSFaults)$' ./cmd/sidera/internal/acceptance)
          for name in TestRuntimeProfileProbesAcrossGeneration TestSuccessfulCommandWithoutTokenPresentationDoesNotPassProbe TestUnobservedPreparationLeavesGenerationOneForDaemon TestRealBinaryTargetNeedsMarkerAndAbnormalExit TestBinarySessionBindingRunsSharedRecipeAcrossGeneration TestBinaryDomainCallbacksPreserveClockFailureAndRejectFSFaults; do
            printf '%s\n' "$names" | grep -Fx "$name"
          done
      - name: repeat original Windows acceptance failures
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            go test -race=false -count=30 -failfast -v -timeout 10m -tags acceptance,crashtest,testclock -run '^(TestRuntimeProfileProbesAcrossGeneration|TestSuccessfulCommandWithoutTokenPresentationDoesNotPassProbe|TestUnobservedPreparationLeavesGenerationOneForDaemon|TestRealBinaryTargetNeedsMarkerAndAbnormalExit|TestBinarySessionBindingRunsSharedRecipeAcrossGeneration|TestBinaryDomainCallbacksPreserveClockFailureAndRejectFSFaults)$' ./cmd/sidera/internal/acceptance
        run: |
          set +e
          go test -race=false -count=30 -failfast -v -timeout 10m -tags acceptance,crashtest,testclock -run '^(TestRuntimeProfileProbesAcrossGeneration|TestSuccessfulCommandWithoutTokenPresentationDoesNotPassProbe|TestUnobservedPreparationLeavesGenerationOneForDaemon|TestRealBinaryTargetNeedsMarkerAndAbnormalExit|TestBinarySessionBindingRunsSharedRecipeAcrossGeneration|TestBinaryDomainCallbacksPreserveClockFailureAndRejectFSFaults)$' ./cmd/sidera/internal/acceptance
          status=$?
          printf '{"command":"repeat original Windows acceptance failures","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: verify explicit export files
        if: ${{ always() }}
        run: |
          for name in manifest.json attempts.jsonl boundary.jsonl ledger-projection.jsonl trace-projection.jsonl; do
            test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/$name"
          done
          test -s "$SIDERA_CI_DIAGNOSTIC_EXPORT/manifest.json"
      - name: upload typed diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .scratch/ci-diagnostic-export/manifest.json
            .scratch/ci-diagnostic-export/attempts.jsonl
            .scratch/ci-diagnostic-export/boundary.jsonl
            .scratch/ci-diagnostic-export/ledger-projection.jsonl
            .scratch/ci-diagnostic-export/trace-projection.jsonl

  windows-delivery:
    name: Diagnostic only - windows-delivery
    if: ${{ github.ref == 'refs/heads/codex/f7b-ci-feedback' }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: verify export privacy boundaries
        run: go test -count=1 -tags diagnostic -run '^TestDiagnostic' ./cmd/sidera/internal/acceptance
      - name: required test must exist
        run: go test -tags acceptance,diagnostic -list '^TestRegisterReplyExactTargetRepro$' ./cmd/sidera/internal/acceptance | grep -Fx 'TestRegisterReplyExactTargetRepro'
      - name: exact Windows delivery target
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            go test -race=false -count=30 -failfast -v -timeout 10m -tags acceptance,diagnostic -run '^TestRegisterReplyExactTargetRepro$' ./cmd/sidera/internal/acceptance
        run: |
          set +e
          go test -race=false -count=30 -failfast -v -timeout 10m -tags acceptance,diagnostic -run '^TestRegisterReplyExactTargetRepro$' ./cmd/sidera/internal/acceptance
          status=$?
          printf '{"command":"exact Windows delivery target","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: required test must exist
        run: go test -tags acceptance -list '^TestCrashAtEveryCrashPointPreservesInvariants$' ./cmd/sidera/internal/acceptance | grep -Fx 'TestCrashAtEveryCrashPointPreservesInvariants'
      - name: original Windows delivery full shard
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=2/4 go test -race=false -count=1 -v -timeout 55m -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...
        run: |
          set +e
          SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=2/4 go test -race=false -count=1 -v -timeout 55m -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...
          status=$?
          printf '{"command":"original Windows delivery full shard","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: verify explicit export files
        if: ${{ always() }}
        run: |
          for name in manifest.json attempts.jsonl boundary.jsonl ledger-projection.jsonl trace-projection.jsonl; do
            test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/$name"
          done
          test -s "$SIDERA_CI_DIAGNOSTIC_EXPORT/manifest.json"
      - name: upload typed diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .scratch/ci-diagnostic-export/manifest.json
            .scratch/ci-diagnostic-export/attempts.jsonl
            .scratch/ci-diagnostic-export/boundary.jsonl
            .scratch/ci-diagnostic-export/ledger-projection.jsonl
            .scratch/ci-diagnostic-export/trace-projection.jsonl

  macos-management:
    name: Diagnostic only - macos-management
    if: ${{ github.ref == 'refs/heads/codex/f7b-ci-feedback' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: verify export privacy boundaries
        run: go test -count=1 -tags diagnostic -run '^TestDiagnostic' ./cmd/sidera/internal/acceptance
      - name: required test must exist
        run: go test -tags acceptance,diagnostic -list '^TestBinaryManagementFeedbackRepro$' ./cmd/sidera/internal/acceptance | grep -Fx 'TestBinaryManagementFeedbackRepro'
      - name: exact macOS management target
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            go test -race=false -count=30 -failfast -v -timeout 10m -tags acceptance,diagnostic -run '^TestBinaryManagementFeedbackRepro$' ./cmd/sidera/internal/acceptance
        run: |
          set +e
          go test -race=false -count=30 -failfast -v -timeout 10m -tags acceptance,diagnostic -run '^TestBinaryManagementFeedbackRepro$' ./cmd/sidera/internal/acceptance
          status=$?
          printf '{"command":"exact macOS management target","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: required test must exist
        run: go test -tags acceptance -list '^TestCrashAtEveryCrashPointPreservesInvariants$' ./cmd/sidera/internal/acceptance | grep -Fx 'TestCrashAtEveryCrashPointPreservesInvariants'
      - name: original macOS management full shard
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=2/2 go test -race=false -count=1 -v -timeout 40m -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...
        run: |
          set +e
          SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=2/2 go test -race=false -count=1 -v -timeout 40m -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...
          status=$?
          printf '{"command":"original macOS management full shard","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: verify explicit export files
        if: ${{ always() }}
        run: |
          for name in manifest.json attempts.jsonl boundary.jsonl ledger-projection.jsonl trace-projection.jsonl; do
            test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/$name"
          done
          test -s "$SIDERA_CI_DIAGNOSTIC_EXPORT/manifest.json"
      - name: upload typed diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .scratch/ci-diagnostic-export/manifest.json
            .scratch/ci-diagnostic-export/attempts.jsonl
            .scratch/ci-diagnostic-export/boundary.jsonl
            .scratch/ci-diagnostic-export/ledger-projection.jsonl
            .scratch/ci-diagnostic-export/trace-projection.jsonl

  windows-runtime:
    name: Diagnostic only - windows-runtime
    if: ${{ github.ref == 'refs/heads/codex/f7b-ci-feedback' }}
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: verify export privacy boundaries
        run: go test -count=1 -tags diagnostic -run '^TestDiagnostic' ./cmd/sidera/internal/acceptance
      - name: required test must exist
        run: go test -tags acceptance -list '^TestCrashAtEveryCrashPointPreservesInvariants$' ./cmd/sidera/internal/acceptance | grep -Fx 'TestCrashAtEveryCrashPointPreservesInvariants'
      - name: original Windows runtime full shard
        env:
          SIDERA_CI_DIAGNOSTIC_COMMAND: >-
            SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=4/4 go test -race=false -count=1 -v -timeout 55m -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...
        run: |
          set +e
          SIDERA_CRASHWALK=full SIDERA_CRASHWALK_SHARD=4/4 go test -race=false -count=1 -v -timeout 55m -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...
          status=$?
          printf '{"command":"original Windows runtime full shard","exit_code":%d}\n' "$status" >> "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          exit "$status"
      - name: verify explicit export files
        if: ${{ always() }}
        run: |
          for name in manifest.json attempts.jsonl boundary.jsonl ledger-projection.jsonl trace-projection.jsonl; do
            test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/$name"
          done
          test -s "$SIDERA_CI_DIAGNOSTIC_EXPORT/manifest.json"
      - name: upload typed diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .scratch/ci-diagnostic-export/manifest.json
            .scratch/ci-diagnostic-export/attempts.jsonl
            .scratch/ci-diagnostic-export/boundary.jsonl
            .scratch/ci-diagnostic-export/ledger-projection.jsonl
            .scratch/ci-diagnostic-export/trace-projection.jsonl
