name: CI
run-name: Diagnostic only - native failure observations

on:
  workflow_dispatch:

permissions:
  contents: read

# Each dispatch is independent. This branch has no automatic trigger or retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SIDERA_CI_DIAGNOSTIC_EXPORT: ${{ github.workspace }}/.scratch/ci-diagnostic-export

# Two independent, single-observation jobs: at most 20 runner-minutes.
jobs:
  windows-cleanup:
    name: Diagnostic only - Windows cleanup observation
    if: ${{ github.ref == 'refs/heads/codex/f7b-native-observation' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: verify explicit privacy and scope canaries
        run: go test -race=false -count=1 -timeout 90s -tags diagnostic -run '^(TestDiagnosticExportAllowlist|TestDiagnosticTruncatedMaterialIsUnavailable|TestDiagnosticWCLProjectionExcludesNativeNamesAndErrorText|TestDiagnosticWCLRemovalScopeUsesOnlyExactFixtureAdapterPath|TestMFObserverDisabledDoesNotInspect|TestMFObserverProjectionAllowlist)$' ./cmd/sidera/internal/acceptance
      - name: exact calibration and original test must exist
        run: |
          names=$(go test -race=false -timeout 90s -tags acceptance,diagnostic,crashtest,testclock -list '^(TestDiagnosticWCLCalibration|TestUnobservedPreparationLeavesGenerationOneForDaemon)$' ./cmd/sidera/internal/acceptance)
          printf '%s\n' "$names" | grep -Fx 'TestDiagnosticWCLCalibration'
          printf '%s\n' "$names" | grep -Fx 'TestUnobservedPreparationLeavesGenerationOneForDaemon'
      - name: calibrate Restart Manager once
        env:
          SIDERA_CI_DIAGNOSTIC_WCL_OBSERVER: '1'
          SIDERA_CI_DIAGNOSTIC_COMMAND: "go test -race=false -count=1 -v -timeout 90s -tags acceptance,diagnostic,crashtest,testclock -run '^TestDiagnosticWCLCalibration$' ./cmd/sidera/internal/acceptance"
        run: go test -race=false -count=1 -v -timeout 90s -tags acceptance,diagnostic,crashtest,testclock -run '^TestDiagnosticWCLCalibration$' ./cmd/sidera/internal/acceptance
      - name: observe original cleanup test once after successful calibration
        env:
          SIDERA_CI_DIAGNOSTIC_WCL_OBSERVER: '1'
          SIDERA_CI_DIAGNOSTIC_COMMAND: "go test -race=false -count=1 -v -timeout 90s -tags acceptance,diagnostic,crashtest,testclock -run '^TestUnobservedPreparationLeavesGenerationOneForDaemon$' ./cmd/sidera/internal/acceptance"
        run: go test -race=false -count=1 -v -timeout 90s -tags acceptance,diagnostic,crashtest,testclock -run '^TestUnobservedPreparationLeavesGenerationOneForDaemon$' ./cmd/sidera/internal/acceptance
      - name: verify explicit export files
        if: ${{ always() }}
        run: |
          test -s "$SIDERA_CI_DIAGNOSTIC_EXPORT/manifest.json"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/boundary.jsonl"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/ledger-projection.jsonl"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/trace-projection.jsonl"
      - name: upload typed diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .scratch/ci-diagnostic-export/manifest.json
            .scratch/ci-diagnostic-export/attempts.jsonl
            .scratch/ci-diagnostic-export/boundary.jsonl
            .scratch/ci-diagnostic-export/ledger-projection.jsonl
            .scratch/ci-diagnostic-export/trace-projection.jsonl

  macos-management:
    name: Diagnostic only - macOS management observation
    if: ${{ github.ref == 'refs/heads/codex/f7b-native-observation' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: verify explicit privacy and scope canaries
        run: go test -race=false -count=1 -timeout 90s -tags diagnostic -run '^(TestDiagnosticExportAllowlist|TestDiagnosticTruncatedMaterialIsUnavailable|TestDiagnosticWCLProjectionExcludesNativeNamesAndErrorText|TestDiagnosticWCLRemovalScopeUsesOnlyExactFixtureAdapterPath|TestMFObserverDisabledDoesNotInspect|TestMFObserverProjectionAllowlist)$' ./cmd/sidera/internal/acceptance
      - name: exact original test must exist
        run: go test -race=false -timeout 90s -tags acceptance,diagnostic -list '^TestBinaryManagementFeedbackRepro$' ./cmd/sidera/internal/acceptance | grep -Fx 'TestBinaryManagementFeedbackRepro'
      - name: observe original management target once
        env:
          SIDERA_CI_DIAGNOSTIC_MF_OBSERVER: '1'
          SIDERA_CI_DIAGNOSTIC_COMMAND: "go test -race=false -count=1 -v -timeout 90s -tags acceptance,diagnostic -run '^TestBinaryManagementFeedbackRepro$' ./cmd/sidera/internal/acceptance"
        run: go test -race=false -count=1 -v -timeout 90s -tags acceptance,diagnostic -run '^TestBinaryManagementFeedbackRepro$' ./cmd/sidera/internal/acceptance
      - name: verify explicit export files
        if: ${{ always() }}
        run: |
          test -s "$SIDERA_CI_DIAGNOSTIC_EXPORT/manifest.json"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/attempts.jsonl"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/boundary.jsonl"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/ledger-projection.jsonl"
          test -f "$SIDERA_CI_DIAGNOSTIC_EXPORT/trace-projection.jsonl"
      - name: upload typed diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .scratch/ci-diagnostic-export/manifest.json
            .scratch/ci-diagnostic-export/attempts.jsonl
            .scratch/ci-diagnostic-export/boundary.jsonl
            .scratch/ci-diagnostic-export/ledger-projection.jsonl
            .scratch/ci-diagnostic-export/trace-projection.jsonl
