name: CI

# A push or pull request that changes only Markdown files starts no run: no job
# builds, tests or packages a Markdown file, so such a run could only repeat the
# verdict of the commit before it. A job that comes to read one (a link check, a
# test that compares a document with the code) must remove this filter first, or
# a change to that document would go unchecked. Manual dispatch always runs.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      # How much of the crash walk of the built binary the crash-walk jobs take.
      # The walk runs on manual dispatch only; see the crashwalk job.
      crashwalk:
        description: Crash walk mode
        type: choice
        options: [full, smoke]
        default: full
      # Whether the bench job runs; see the bench job.
      benchmarks:
        description: Run the single-sample benchmarks
        type: boolean
        default: false

# Nothing here writes to the repository, so the token only ever reads it.
permissions:
  contents: read

# A newer push to a pull request supersedes that request's older run, and so
# does a manual dispatch on a branch other than main: a newer dispatch of the
# same branch supersedes its older run. Every
# other run (push to main, dispatch on main) is its own group, named by its run
# id, so runs on main never cancel, replace or wait for one another and each
# commit keeps its own verdict. A group holds one running and one pending run,
# and a newer pending run replaces the older one, so sharing a group per branch
# would drop the verdict of a commit pushed while another is still running.
# The condition is written out twice, in the group and in cancel-in-progress,
# because an expression cannot be shared between them; keep the two identical.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

jobs:
  # The checks that decide whether the code is right, on every platform a node
  # runs on. The steps that take long run as jobs of their own (race, bench), so
  # that they run side by side on separate machines and a run takes about as
  # long as its longest step and not the sum of them.
  #
  # go test stops a package after 10 minutes unless told otherwise; the explicit
  # limit leaves the job's own timeout room for setup and a readable failure.
  # The power-loss tests replay a crash on an in-memory file system, so only
  # Linux runs them; the other platforms skip them by name.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    env:
      SKIP_TESTS: ${{ matrix.os != 'ubuntu-latest' && '^TestPowerLossClone' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go test
        run: go test -count=1 -timeout 30m -skip "$SKIP_TESTS" ./... ./sdk/go/...
      # go test prints t.Log output and skip reasons only with -v or on failure.
      # The platform tests of these two packages log what they measure on the
      # runner and skip what the runner cannot do, so they run once more, verbosely,
      # to put those values and reasons in the log. A new package with platform
      # tests that log or skip must be added here.
      - name: go test -v (platform packages)
        run: go test -count=1 -v -timeout 30m -skip "$SKIP_TESTS" ./internal/node/fsx ./internal/node/ipc

  # The race detector needs cgo and a C compiler, which the Linux, macOS and
  # Windows x64 hosted images ship, and Go does not support it on windows/arm64,
  # so there is no job for that platform.
  #
  # The race run of a platform spreads about 2,700 package-seconds over four
  # processors, so it is bound by processors and not by one package: on Windows
  # x64 the step took 940 to 980 s while its slowest package took about 500 s.
  # Two machines halve it. The tree under internal/node and every other package
  # hold about half of that time each, and a split by directory keeps what each
  # part holds obvious and needs no list to maintain. The packages are listed by
  # one go list and divided in the select step, so that the two parts are
  # complements of each other by construction and a new package lands in one of
  # them without editing this file.
  race:
    name: race (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        part: [node, rest]
    defaults:
      run:
        shell: bash
    env:
      SKIP_TESTS: ${{ matrix.os != 'ubuntu-latest' && '^TestPowerLossClone' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # The node part is internal/node and every package under it; the rest part
      # is every other package of ./... and ./sdk/go/....
      - name: packages of this part
        id: packages
        env:
          PART: ${{ matrix.part }}
        run: |
          node=$(GOWORK=off go list -m)/internal/node
          all=$(go list ./... ./sdk/go/...)
          if [ "$PART" = node ]; then
            packages=$(echo "$all" | awk -v node="$node" '$0 == node || index($0, node "/") == 1')
          else
            packages=$(echo "$all" | awk -v node="$node" '!($0 == node || index($0, node "/") == 1)')
          fi
          if [ -z "$packages" ]; then
            echo "::error::no package selected for the $PART part"
            exit 1
          fi
          echo "$packages"
          echo "packages=$(echo "$packages" | tr '\n' ' ')" >>"$GITHUB_OUTPUT"
      # $PACKAGES, the packages the previous step printed, is a list of words on
      # purpose.
      - name: go test -race
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: |
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 30m -skip "$SKIP_TESTS" $PACKAGES

  # One untagged, non-race sample records each platform's real filesystem
  # costs. These are measurements, not performance thresholds, and nothing reads
  # them automatically. Their one consumer is the cold-start threshold in the
  # storage reference, which a person checks when the store's scan or the
  # platform changes, as with the crash walk. On every push they cost four jobs,
  # one of them on macOS, and on Windows x64 a job of about 900 s that was as long
  # as any test job. So they run on manual dispatch only, when the benchmarks
  # input asks for them: before a release or after a change to the store's scan.
  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    name: benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: single-sample benchmarks
        run: |
          go test -run '^$' -bench '^BenchmarkFilesystemWrites$' -benchtime=1x -count=1 -timeout 10m ./internal/node/fsx
          go test -run '^$' -bench '^BenchmarkTransactionWrites$' -benchtime=1x -count=1 -timeout 10m ./internal/node/testkit/acceptance/inproc
          go test -run '^$' -bench '^BenchmarkColdStartScan$' -benchtime=1x -count=1 -timeout 30m ./internal/node/store

  # The tests again with the build tags that select binary-level crash points
  # and the test clock, which the untagged job never compiles. The tests behind
  # the acceptance tag run in their own jobs, not here; the vet job type-checks
  # the files of every tag.
  #
  # Only the packages whose test binary the two tags change are tested: any other
  # package builds the same test from the same files, so running it again would
  # repeat the verdict of the test job. scripts/tagged-test-packages.sh reads the
  # list from go list, so a package that comes to depend on one of the tags is
  # picked up without editing this file.
  test-tags:
    name: test with tags (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    env:
      SKIP_TESTS: ${{ matrix.os != 'ubuntu-latest' && '^TestPowerLossClone' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: packages the tags change
        id: tagged
        run: |
          packages=$(scripts/tagged-test-packages.sh crashtest,testclock)
          echo "$packages"
          echo "packages=$(echo "$packages" | tr '\n' ' ')" >>"$GITHUB_OUTPUT"
      # $PACKAGES, the packages the previous step printed, is a list of words on
      # purpose.
      - name: go test with tags
        env:
          PACKAGES: ${{ steps.tagged.outputs.packages }}
        run: |
          # shellcheck disable=SC2086
          go test -count=1 -timeout 30m -tags crashtest,testclock -skip "$SKIP_TESTS" $PACKAGES
      - name: go test -race with tags
        if: matrix.os != 'windows-11-arm'
        env:
          PACKAGES: ${{ steps.tagged.outputs.packages }}
        run: |
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 30m -tags crashtest,testclock -skip "$SKIP_TESTS" $PACKAGES

  # The tests that drive built binaries, one job per platform. Their files carry
  # the acceptance tag, which no other job runs tests with (test-tags only vets
  # it), so they have their own job, limit and timeout. The outer test also needs
  # crashtest,testclock to run the tagged process prerequisite regression; child
  # builds select their own tags, so the plain child stays untagged. The crash
  # walk is left to the crash-walk jobs, which run on demand; the walk and these
  # tests are told apart by name, and the walk's test names all start with
  # TestCrashAtEveryCrashPoint.
  #
  # The test binary builds the binaries it drives, and builds them with -race
  # when it is itself built with -race. Only Linux passes -race: the race
  # detector then watches real processes talking to one another once per run,
  # on the platform where it is fastest, while on macOS and Windows it would
  # slow every run several times over for platforms whose point here is renames
  # and process handling, not races.
  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    env:
      RACE: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go test with the acceptance tag
        run: go test -race="$RACE" -count=1 -timeout 25m -tags acceptance,crashtest,testclock -skip '^TestCrashAtEveryCrashPoint' ./cmd/sidera ./cmd/sidera/internal/acceptance/...

  # The crash walk of the built binary: it kills a real process at each crash
  # point and checks what the restart finds. It runs on manual dispatch only.
  # The full walk reruns about 2,000 real-process crashes on each of three
  # operating systems, and what it adds over the rest is the end-to-end scenario
  # of the built binary: per-operation crash recovery is already checked on
  # every push by the crash tests of the store, the engine and the daemon (in the
  # test jobs; the crashtest tag only adds the daemon's binary-level crash
  # points). So the scenario walk is run when it is wanted, such as before a
  # release or after a change to recovery code, and not on every push.
  #
  # It does not use the race detector on any platform. Race detection belongs
  # where it finds races at the lowest layer: the race steps of the test jobs
  # and the Linux acceptance job drive the same concurrent code. The walk
  # checks crash consistency, and rerunning thousands of real-process crashes
  # under the race detector would only repeat that check at about four times
  # the cost per crash point.
  #
  # The walk is split into shards that run in
  # parallel, because one platform's whole walk does not fit in a job: shard i of
  # n takes every n-th run of the walk (SIDERA_CRASHWALK_SHARD), and together the
  # shards take every run once. The counts and limits below are sized for the
  # slowest platform's shard, and the log of each run (-v) carries the time of
  # every rerun, so the next adjustment is made from numbers and not from guesses.
  #
  # SIDERA_CRASHWALK is the mode: full takes every crash point, smoke takes one
  # point per transaction, which makes a quick rerun after a failure. A dispatch
  # that leaves the input out takes full. go test's own limit is set a few
  # minutes under the job's, so that a hang ends with the goroutine dump of the
  # test binary and not with the job being killed.
  crashwalk:
    if: github.event_name == 'workflow_dispatch'
    name: crash walk (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 1, shards: 3, timeout: 45, test-timeout: 40m}
          - {os: ubuntu-latest, shard: 2, shards: 3, timeout: 45, test-timeout: 40m}
          - {os: ubuntu-latest, shard: 3, shards: 3, timeout: 45, test-timeout: 40m}
          - {os: macos-latest, shard: 1, shards: 2, timeout: 45, test-timeout: 40m}
          - {os: macos-latest, shard: 2, shards: 2, timeout: 45, test-timeout: 40m}
          - {os: windows-latest, shard: 1, shards: 4, timeout: 60, test-timeout: 55m}
          - {os: windows-latest, shard: 2, shards: 4, timeout: 60, test-timeout: 55m}
          - {os: windows-latest, shard: 3, shards: 4, timeout: 60, test-timeout: 55m}
          - {os: windows-latest, shard: 4, shards: 4, timeout: 60, test-timeout: 55m}
    defaults:
      run:
        shell: bash
    env:
      SIDERA_CRASHWALK: ${{ inputs.crashwalk || 'full' }}
      SIDERA_CRASHWALK_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      TEST_TIMEOUT: ${{ matrix.test-timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # A -run pattern that matches no test passes without running anything, so a
      # renamed walk would turn this job green and empty. grep exits 1 unless the
      # list names the walk.
      - name: the walk must exist
        run: go test -tags acceptance -list '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/... | grep '^TestCrashAtEveryCrashPoint'
      - name: go test crash walk
        run: go test -count=1 -v -timeout "$TEST_TIMEOUT" -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...

  # go vet for every platform Sidera ships for, with and without the build tags,
  # in one Linux job. vet reads source and type-checks it; it builds nothing for
  # the platform and runs nothing. With no cgo file in the repository, vet with
  # GOOS and GOARCH set (and CGO_ENABLED=0, as the release is built) selects
  # exactly the files a vet run natively on that platform selects, so one Linux
  # runner vets all six. That replaces a vet run in each of the test and tagged
  # jobs, on the macOS and Windows runners among them, and also vets darwin/amd64
  # and linux/arm64, which have no test job. The tag set adds the files behind
  # the tags, which the vet without tags does not read.
  #
  # A cgo file would end this: a vet with CGO_ENABLED=0 skips it, so that
  # platform's vet would have to go back to a native runner.
  #
  # A failing platform does not stop the loop, so that one platform's failure
  # does not hide another's; the step fails at the end if any failed.
  #
  # The job keeps no cache (cache: false), for the reason given under
  # linux-checks: it would save a nearly empty entry before the Linux test jobs
  # could save theirs.
  vet:
    name: go vet (every platform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet for every platform
        run: |
          failed=0
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "::group::$platform"
            CGO_ENABLED=0 GOOS=${platform%/*} GOARCH=${platform#*/} go vet ./... ./sdk/go/... || {
              echo "::error::go vet failed for $platform"
              failed=1
            }
            CGO_ENABLED=0 GOOS=${platform%/*} GOARCH=${platform#*/} go vet -tags crashtest,testclock,acceptance,netacceptance ./... ./sdk/go/... || {
              echo "::error::go vet with tags failed for $platform"
              failed=1
            }
            echo "::endgroup::"
          done
          exit "$failed"

  # The checks that need one runner each and no matrix, in one job: formatting,
  # sdk/go on its own, and the cross-compile with the release archives. GitHub
  # runs at most 20 jobs of the account at once, five of them on macOS. A push
  # started 22 jobs when these were three, so even a run alone had two jobs
  # waiting for a runner, and a run that overlapped another queued its jobs for
  # minutes. The three take about four minutes together, less than any of the
  # test jobs, so one job costs the run no time and keeps a push within those 20 jobs.
  # Every step after the first runs even when an earlier one failed, so that a
  # failure does not hide the verdict of the others.
  #
  # sdk/go is published as its own module, so it must build, test and be tidy
  # without go.work; its steps switch the workspace off.
  #
  # Every binary and package must build for every platform Sidera ships for,
  # statically (CGO_ENABLED=0), whichever runner builds it.
  #
  # scripts/release.sh runs for real only when a tag is pushed, so a change that
  # breaks it (a program that no longer builds as a package, a module whose licence
  # the notices refuse) would otherwise surface at the first release. The script
  # builds the archives into a directory outside the checkout and publishes nothing.
  # The version is a placeholder that no tag will carry; the script only needs one
  # that looks like a version, and a changelog section is not read here.
  #
  # The loop and the script build the same packages for the same six platforms,
  # so they are steps of one job: the script builds with -trimpath, and so does
  # the loop, which makes the script's builds come from the build cache the loop
  # filled.
  #
  # The job keeps no cache of its own between runs (cache: false). It ends in
  # minutes, before the test jobs, so the entry it saved would hold almost none
  # of what they build and keep them from saving theirs; its cross-compiles are
  # not the test jobs' builds (other target, other flags) in any case.
  linux-checks:
    name: gofmt, sdk/go and release archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt -l must list nothing
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: sdk/go go build
        if: ${{ !cancelled() }}
        working-directory: sdk/go
        env:
          GOWORK: "off"
        run: go build ./...
      - name: sdk/go go test
        if: ${{ !cancelled() }}
        working-directory: sdk/go
        env:
          GOWORK: "off"
        run: go test ./...
      - name: sdk/go go mod tidy -diff
        if: ${{ !cancelled() }}
        working-directory: sdk/go
        env:
          GOWORK: "off"
        run: go mod tidy -diff
      - name: go build for every platform
        if: ${{ !cancelled() }}
        run: |
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "::group::$platform"
            CGO_ENABLED=0 GOOS=${platform%/*} GOARCH=${platform#*/} go build -trimpath ./... ./sdk/go/... || {
              echo "::error::go build failed for $platform"
              exit 1
            }
            echo "::endgroup::"
          done
      - name: scripts/release.sh
        if: ${{ !cancelled() }}
        run: scripts/release.sh 0.0.0-dryrun "$RUNNER_TEMP/dist"
      - name: checksums.txt verifies and names the six archives
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -c checksums.txt
          test "$(wc -l < checksums.txt)" -eq 6
