name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # How much of the crash walk of the built binary the crash-walk jobs take.
      # A run that has no input (a push, a pull request) takes full, see below.
      crashwalk:
        description: Crash walk mode
        type: choice
        options: [full, smoke]
        default: full

# Nothing here writes to the repository, so the token only ever reads it.
permissions:
  contents: read

# A newer push to a pull request supersedes that request's older run. Every
# other run (push to main, manual dispatch) is its own group, named by its run
# id, so runs on main never cancel, replace or wait for one another and each
# commit keeps its own verdict. A group holds one running and one pending run,
# and a newer pending run replaces the older one, so sharing a group per branch
# would drop the verdict of a commit pushed while another is still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt -l must list nothing
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  # The same three checks on every platform a node runs on. The race detector
  # needs cgo and a C compiler; all three hosted images ship one.
  #
  # go test stops a package after 10 minutes unless told otherwise; the explicit
  # limit leaves the job's own timeout room for setup and a readable failure.
  # The power-loss tests replay a crash on an in-memory file system, so only
  # Linux runs them; the other platforms skip them by name.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SKIP_TESTS: ${{ matrix.os != 'ubuntu-latest' && '^TestPowerLossClone' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go vet
        run: go vet ./... ./sdk/go/...
      - name: go test
        run: go test -count=1 -timeout 30m -skip "$SKIP_TESTS" ./... ./sdk/go/...
      - name: go test -race
        run: go test -race -count=1 -timeout 30m -skip "$SKIP_TESTS" ./... ./sdk/go/...
      # go test prints t.Log output and skip reasons only with -v or on failure.
      # The platform tests of these two packages log what they measure on the
      # runner and skip what the runner cannot do, so they run once more, verbosely,
      # to put those values and reasons in the log. A new package with platform
      # tests that log or skip must be added here.
      - name: go test -v (platform packages)
        run: go test -count=1 -v -timeout 30m -skip "$SKIP_TESTS" ./internal/node/fsx ./internal/node/ipc
      # One untagged, non-race sample records each platform's real filesystem
      # costs. These are measurements, not performance thresholds.
      - name: single-sample benchmarks
        run: |
          go test -run '^$' -bench '^BenchmarkFilesystemWrites$' -benchtime=1x -count=1 -timeout 10m ./internal/node/fsx
          go test -run '^$' -bench '^BenchmarkTransactionWrites$' -benchtime=1x -count=1 -timeout 10m ./internal/node/testkit/acceptance/inproc
          go test -run '^$' -bench '^BenchmarkColdStartScan$' -benchtime=1x -count=1 -timeout 30m ./internal/node/store

  # The same checks again with the build tags that select binary-level crash
  # points and the test clock, which the untagged job never compiles. vet also
  # sees the acceptance tag, so the files it selects are type-checked on every
  # platform; the tests behind that tag run in their own jobs, not here.
  test-tags:
    name: test with tags (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SKIP_TESTS: ${{ matrix.os != 'ubuntu-latest' && '^TestPowerLossClone' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go vet with tags
        run: go vet -tags crashtest,testclock,acceptance ./... ./sdk/go/...
      - name: go test with tags
        run: go test -count=1 -timeout 30m -tags crashtest,testclock -skip "$SKIP_TESTS" ./... ./sdk/go/...
      - name: go test -race with tags
        run: go test -race -count=1 -timeout 30m -tags crashtest,testclock -skip "$SKIP_TESTS" ./... ./sdk/go/...

  # The tests that drive built binaries, one job per platform. Their files carry
  # the acceptance tag, which no other job runs tests with (test-tags only vets
  # it), so they have their own job, limit and timeout. The outer test also needs
  # crashtest,testclock to run the tagged process prerequisite regression; child
  # builds select their own tags, so the plain child stays untagged. The crash
  # walk is left to the crash-walk jobs; the walk and these tests are told apart by name, and the
  # walk's test names all start with TestCrashAtEveryCrashPoint.
  #
  # The test binary builds the binaries it drives, and builds them with -race
  # when it is itself built with -race. Only Linux passes -race: the race
  # detector then watches real processes talking to one another once per run,
  # on the platform where it is fastest, while on Windows it would slow every
  # rerun several times over for a platform whose point here is renames and
  # process handling, not races.
  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      RACE: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go test with the acceptance tag
        run: go test -race="$RACE" -count=1 -timeout 25m -tags acceptance,crashtest,testclock -skip '^TestCrashAtEveryCrashPoint' ./cmd/sidera ./cmd/sidera/internal/acceptance/...

  # The crash walk of the built binary: it kills a real process at each crash
  # point and checks what the restart finds. It is split into shards that run in
  # parallel, because one platform's whole walk does not fit in a job: shard i of
  # n takes every n-th run of the walk (SIDERA_CRASHWALK_SHARD), and together the
  # shards take every run once. The counts and limits below are sized for the
  # slowest platform's shard, and the log of each run (-v) carries the time of
  # every rerun, so the next adjustment is made from numbers and not from guesses.
  #
  # SIDERA_CRASHWALK is the mode: full takes every crash point, smoke takes one
  # point per transaction, which makes a quick rerun after a failure. A run that
  # has no input, such as a push to main, takes full. go test's own limit is set
  # a few minutes under the job's, so that a hang ends with the goroutine dump of
  # the test binary and not with the job being killed. -race is passed on Linux
  # only, for the reason given at the acceptance job.
  crashwalk:
    name: crash walk (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 1, shards: 3, timeout: 45, test-timeout: 40m}
          - {os: ubuntu-latest, shard: 2, shards: 3, timeout: 45, test-timeout: 40m}
          - {os: ubuntu-latest, shard: 3, shards: 3, timeout: 45, test-timeout: 40m}
          - {os: macos-latest, shard: 1, shards: 2, timeout: 45, test-timeout: 40m}
          - {os: macos-latest, shard: 2, shards: 2, timeout: 45, test-timeout: 40m}
          - {os: windows-latest, shard: 1, shards: 4, timeout: 60, test-timeout: 55m}
          - {os: windows-latest, shard: 2, shards: 4, timeout: 60, test-timeout: 55m}
          - {os: windows-latest, shard: 3, shards: 4, timeout: 60, test-timeout: 55m}
          - {os: windows-latest, shard: 4, shards: 4, timeout: 60, test-timeout: 55m}
    defaults:
      run:
        shell: bash
    env:
      RACE: ${{ matrix.os == 'ubuntu-latest' }}
      SIDERA_CRASHWALK: ${{ inputs.crashwalk || 'full' }}
      SIDERA_CRASHWALK_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      TEST_TIMEOUT: ${{ matrix.test-timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # A -run pattern that matches no test passes without running anything, so a
      # renamed walk would turn this job green and empty. grep exits 1 unless the
      # list names the walk.
      - name: the walk must exist
        run: go test -tags acceptance -list '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/... | grep '^TestCrashAtEveryCrashPoint'
      - name: go test crash walk
        run: go test -race="$RACE" -count=1 -v -timeout "$TEST_TIMEOUT" -tags acceptance -run '^TestCrashAtEveryCrashPoint' ./cmd/sidera/internal/acceptance/...

  # sdk/go is published as its own module, so it must build, test and be tidy
  # without go.work.
  sdk-standalone:
    name: sdk/go without go.work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: go mod tidy -diff
        run: go mod tidy -diff

  # Every binary and package must build for every platform Sidera ships for,
  # statically (CGO_ENABLED=0), whichever runner builds it.
  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The five matrix jobs would race to save one identical cache entry.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go build
        run: go build ./... ./sdk/go/...
